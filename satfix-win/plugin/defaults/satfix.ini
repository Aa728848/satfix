; satfix —— Stellaris 定点溢出守卫
;
; 这个文件是**默认值**。启动器会在插件文件夹的 config\ 里生成同名文件，
; 用户在插件页点齿轮编辑的就是那一份；这里改了要重新部署才会生效。
;
; 改动会在游戏运行中被自动重读（插件每 2 秒看一次修改时间），不必重启游戏。
;
; 发布版是回写模式：检出溢出就把数值改回饱和值。这是**编译期**开关
; （build.ps1 -Replace），故意不做成配置项，免得手动注入时误改存档。
; 只记录不改数值的「影子模式」是开发时自测用的，不随发布包分发 ——
; 要哪种模式看日志第一行的 satfix-build-mode:write-back / :shadow。

[general]
; 总开关。false = 不安装任何钩子（等同于没有这个插件）
enabled = true

; 每一条检出都写日志。关掉后只保留计数与心跳（日志上限 500 行）
verbose_events = true

; 周期性汇总：每 N 次调用打一次分类计数；0 或 false 关闭
heartbeat = false
heartbeat_every = 200000

; 护盾/装甲/船体上限的「合理上限」，单位是 CFixedPoint 存储值（1e5 = 1 游戏单位）
; 现在只在**重算辅助函数解析失败**的退化路径上用作兜底判据。
; 默认 1e18 已贴近 int64 上限（9.22e18），所以实际上靠「结果为负」这一条。
; 真出现合法的大数值，把它调大即可。
max_hp_cap = 1000000000000000000

; 护盾/装甲/船体上限做**忠实重算**（等值比对 + 溢出时回写饱和值）。
; 这是把「溢出后变成 0 / 负数」修成「保持数值上限」的那条路径，
; 依赖 ship_size_of / modifier_value 两个辅助函数解析成功；
; 解析不到时自动退化成「只认负数」。要排查重算本身的问题可以关掉它。
verify_max_hp = true

; 变量系统（add_variable / multiply_variable）做忠实重算，同样依赖 4 个辅助函数。
verify_variables = true

; 诊断开关。默认全关 —— 开启会引入逐调用开销，只在排查问题时短时打开。
; diag_recompute_calls：上限重算链 + 伤害取值的诊断行数（0 = 关）
; diag_modifier_calls：ApplyModifierMult 的 ModifierType 直方图（0 = 关）
; log_recompute_mismatch：记录「重算≠游戏但未达回写阈值」
; collapse_log_limit：「加算溢出塌成 0」事件最多写多少行
diag_recompute_calls = 0
diag_modifier_calls = 0
log_recompute_mismatch = false
collapse_log_limit = 64
