; satfix —— Stellaris 定点溢出守卫
;
; 这个文件是**默认值**。启动器会在插件文件夹的 config\ 里生成同名文件，
; 用户在插件页点齿轮编辑的就是那一份；这里改了要重新部署才会生效。
;
; 改动会在游戏运行中被自动重读（插件每 2 秒看一次修改时间），不必重启游戏。
;
; 发布版是回写模式：检出溢出就把数值改回饱和值。这是**编译期**开关
; （build.ps1 -Replace），故意不做成配置项，免得手动注入时误改存档。
; 只记录不改数值的「影子模式」是开发时自测用的，不随发布包分发 ——
; 要哪种模式看日志第一行的 satfix-build-mode:write-back / :shadow。

[general]
; 总开关。false = 不安装任何钩子（等同于没有这个插件）
enabled = true

; 每一条检出都写日志。关掉后只保留计数与心跳（日志上限 500 行）
verbose_events = true

; 周期性汇总：每 N 次调用打一次分类计数；0 或 false 关闭
heartbeat = false
heartbeat_every = 200000

; 护盾/装甲/船体上限的「合理上限」，单位是 CFixedPoint 存储值（1e5 = 1 游戏单位）
; 默认 1e11 = 100 万游戏单位 —— 远高于任何正常舰船，只用来兜住溢出后的荒谬值。
; 真出现合法的大数值，把它调大即可。
max_hp_cap = 100000000000
